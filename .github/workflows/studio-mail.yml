name: Studio Gmail reply sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: studio-mail
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.STUDIO_GMAIL_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request reply sync (no mailbox credentials on GitHub)
        env:
          SYNC_URL: ${{ secrets.STUDIO_MAIL_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.STUDIO_MAIL_SYNC_TOKEN }}
        run: python3 scripts/request-mail-sync.py
